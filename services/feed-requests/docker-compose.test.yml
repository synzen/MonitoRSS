services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=feedrequests
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --save ""
    tmpfs: /data

  tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=local
      - NODE_OPTIONS=--experimental-vm-modules
      - FEED_REQUESTS_POSTGRES_URI=postgres://postgres:postgres@postgres:5432/feedrequests
      - FEED_REQUESTS_API_KEY=feed-requests-api-key
      - FEED_REQUESTS_API_PORT=5000
      - FEED_REQUESTS_RABBITMQ_BROKER_URL=amqp://guest:guest@localhost:5672
      - FEED_REQUESTS_REDIS_URI=redis://redis:6379
      - FEED_REQUESTS_REDIS_DISABLE_CLUSTER=true
      - FEED_REQUESTS_FEED_REQUEST_DEFAULT_USER_AGENT=MonitoRSS
      - FEED_REQUESTS_MAX_FAIL_ATTEMPTS=11
      - FEED_REQUESTS_REQUEST_TIMEOUT_MS=15000
      - FEED_REQUESTS_RABBITMQ_PREFETCH_COUNT=3
      - FEED_REQUESTS_HISTORY_PERSISTENCE_MONTHS=2
      - FEED_REQUESTS_FAILED_REQUEST_DURATION_THRESHOLD_HOURS=48
      - FEED_REQUESTS_S3_API_KEY_ID=1
      - FEED_REQUESTS_S3_API_KEY=1
    command: bash -c "${TEST_COMMAND:-npx jest}"
